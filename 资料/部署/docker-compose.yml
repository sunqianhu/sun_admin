version: '3.8'

services:
  #redis
  redis:
    image: redis:6.0-alpine3.19
    container_name: sun_admin_redis
    command: ["redis-server", "--requirepass", "Sunqianhu@Redis520#"]
    networks:
      - sun_admin
    restart: always
  #后端
  back:
    image: harbor.reefun.com/sun_admin/sun_admin_back:3.8.7
    container_name: sun_admin_back
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/www/sun_admin.sunqianhu.com/back/.env:/var/www/html/.env
      - /home/www/sun_admin.sunqianhu.com/back/public/storage:/var/www/html/public/storage
    networks:
      - sun_admin
    restart: always
  #前端
  front:
    image: harbor.reefun.com/sun_admin/sun_admin_front:3.8.7
    container_name: sun_admin_front
    depends_on:
      - back
    ports:
      - "127.0.0.1:9110:80"
    networks:
      - sun_admin
    restart: always
  #前端移动端
  front_mobile:
    image: harbor.reefun.com/sun_admin/sun_admin_front_mobile:3.8.7
    container_name: sun_admin_front_mobile
    depends_on:
      - back
    ports:
      - "127.0.0.1:9111:80"
    networks:
      - sun_admin
    restart: always
  #数据库
  mysql:
    image: mysql:5.7.44
    container_name: sun_admin_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Hello*@SunAdmin#
      MYSQL_DATABASE: sun_admin
      MYSQL_USER: sun_admin
      MYSQL_PASSWORD: aW9%mY1(fV9[gI6!
    volumes:
      - /home/www/sun_admin.sunqianhu.com/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - sun_admin
    restart: always
networks:
  sun_admin:
    driver: bridge
