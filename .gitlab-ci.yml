stages:
  - build
  - package

variables:
  GIT_DEPTH: "0"

before_script:
  - echo "checking docker daemon status..."
  - docker info || (echo "docker daemon is not running!" && exit 1)

build_back:
  stage: build
  script:
    - cd back
    - docker build -t sun_admin_back:latest .
  only:
    - product
  tags:
    - runner171

build_front:
  stage: build
  script:
    - cd front
    - docker build -t sun_admin_front:latest .
  only:
    - product
  tags:
    - runner171

package_images:
  stage: package
  script:
    - docker save -o sun_admin_back.tar.gz sun_admin_back:latest
    - docker save -o sun_admin_front.tar.gz sun_admin_front:latest
    - tar -czvf sun_admin.tar.gz sun_admin_back.tar.gz sun_admin_front.tar.gz
  artifacts:
    name: sun_admin
    paths:
      - sun_admin.tar.gz
    expire_in: 1 week
  only:
    - product
  tags:
    - runner171
