stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

services:
  - docker:dind

# 构建后端镜像并推送
build_backend:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG-backend ./back_thinkphp
    - docker push $IMAGE_TAG-backend
  only:
    - main

# 构建前端镜像并推送
build_frontend:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG-frontend ./front_desktop
    - docker push $IMAGE_TAG-frontend
  only:
    - main

# 部署到生产环境
deploy_production:
  stage: deploy
  script:
    - apk add --no-cache openssh
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "docker-compose down || true"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "docker-compose pull"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "docker-compose up -d"
  environment:
    name: production
    url: http://your-production-url.com
  only:
    - main