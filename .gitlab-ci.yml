stages:
  - test
  - build
  - package
  - push

variables:
  GIT_DEPTH: "0"
  VERSION: "$CI_COMMIT_SHORT_SHA"
  HARBOR_PROJECT: sun_admin

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "product"'
    - when: never

before_script:
  - echo "checking docker daemon status..."
  - docker info || (echo "docker daemon is not running!" && exit 1)

test_back:
  stage: test
  script:
    - 'test -f "$BACK_TEST_ENV_FILE" || (echo "请配置文件变量 BACK_TEST_ENV_FILE" && exit 1)'
    - cp "$BACK_TEST_ENV_FILE" back/docker/.env_test
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      --env COMPOSER_HOME=/tmp/composer
      --entrypoint sh
      --network host
      -v "$CI_PROJECT_DIR/back:/var/www/html"
      -v "$CI_PROJECT_DIR/back/docker/.env_test:/var/www/html/.env"
      -w /var/www/html
      sunqianhu/php_nginx:php8235nginx1319
      -c "composer install --no-interaction --prefer-dist &&
      php vendor/phpunit/phpunit/phpunit --log-junit tests/report.xml"
  artifacts:
    when: always
    reports: #声明能够被 GitLab识别的报告
      junit: back/tests/report.xml #报告类型，表示文件采用 JUnit XML 测试报告格式
  tags:
    - runner22

build_back:
  stage: build
  script:
    - cd back
    - docker build --build-arg VERSION="$VERSION" -t sun_admin_back:$VERSION .
  tags:
    - runner22

build_front:
  stage: build
  script:
    - 'test -f "$FRONT_ENV_FILE" || (echo "请配置文件类型变量 FRONT_ENV_FILE" && exit 1)'
    - cd front
    - cp "$FRONT_ENV_FILE" .env.production
    - docker build -t sun_admin_front:$VERSION .
  tags:
    - runner22

build_front_mobile:
  stage: build
  script:
    - 'test -f "$FRONT_MOBILE_ENV_FILE" || (echo "请配置文件类型变量 FRONT_MOBILE_ENV_FILE" && exit 1)'
    - cd front_mobile
    - cp "$FRONT_MOBILE_ENV_FILE" .env.production
    - docker build -t sun_admin_front_mobile:$VERSION .
  tags:
    - runner22

package_images:
  stage: package
  script:
    - docker save -o sun_admin_back_$VERSION.tar sun_admin_back:$VERSION
    - docker save -o sun_admin_front_$VERSION.tar sun_admin_front:$VERSION
    - docker save -o sun_admin_front_mobile_$VERSION.tar sun_admin_front_mobile:$VERSION
  artifacts:
    name: sun_admin_$VERSION
    paths:
      - sun_admin_back_$VERSION.tar
      - sun_admin_front_$VERSION.tar
      - sun_admin_front_mobile_$VERSION.tar
    expire_in: 1 week
  tags:
    - runner22

push_images:
  stage: push
  needs:
    - package_images
  before_script:
    - 'test -n "$HARBOR_REGISTRY" || (echo "HARBOR_REGISTRY is not configured" && exit 1)'
    - 'test -n "$HARBOR_USERNAME" || (echo "HARBOR_USERNAME is not configured" && exit 1)'
    - 'test -n "$HARBOR_PASSWORD" || (echo "HARBOR_PASSWORD is not configured" && exit 1)'
    - 'printf "%s" "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin'
  script:
    - docker tag sun_admin_back:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_back:$VERSION"
    - docker tag sun_admin_front:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front:$VERSION"
    - docker tag sun_admin_front_mobile:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front_mobile:$VERSION"
    
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_back:$VERSION"
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front:$VERSION"
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front_mobile:$VERSION"
  after_script:
    - docker logout "$HARBOR_REGISTRY" || true
  tags:
    - runner22
