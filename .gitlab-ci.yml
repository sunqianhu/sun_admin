stages:
  - build

image: docker

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $DOCKER_REGISTRY/inspection/inspection_server:test
  LOCAL_NAME: inspection_server:test
  PROD_IMAGE_NAME: $DOCKER_REGISTRY/inspection/inspection_server:prod
  PROD_LOCAL_NAME: inspection_server:prod

build_prod:
  stage: build
  services:
    - name: docker:dind
  before_script:
    - docker info
    - docker login -u $DOCKER_USER -p $DOCKER_PASSWORD $DOCKER_REGISTRY
  script:
    - docker build --cache-from $PROD_IMAGE_NAME -t $PROD_IMAGE_NAME -t $PROD_LOCAL_NAME .
    - docker push $PROD_IMAGE_NAME
    - docker save $PROD_LOCAL_NAME | gzip > inspection_server.tar.gz
  artifacts:
    name: inspection_server_prod
    expire_in: "86400"
    paths:
      - inspection_server.tar.gz
    when: on_success
  only:
    - prod
  tags:
    - "219"
