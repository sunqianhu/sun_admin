stages:
  - build
  - package

variables:
  GIT_DEPTH: "0"

before_script:
  - echo "before script"

build_back_thinkphp:
  stage: build
  script:
    - cd back_thinkphp
    - docker build -t sun_admin_back_thinkphp:latest .
  only:
    - product
  tags:
    - runner171

build_front_desktop:
  stage: build
  script:
    - cd front_desktop
    - docker build -t sun_admin_front_desktop:latest .
  only:
    - product
  tags:
    - runner171

package_images:
  stage: package
  script:
    - docker save -o sun_admin_back_thinkphp.tar sun_admin_back_thinkphp:latest
    - docker save -o sun_admin_front_desktop.tar sun_admin_front_desktop:latest
    - tar -czvf sun_admin.tar.gz sun_admin_back_thinkphp.tar sun_admin_front_desktop.tar
  artifacts:
    name: sun_admin
    paths:
      - sun_admin.tar.gz
    expire_in: 1 week
  only:
    - product
  tags:
    - runner171
