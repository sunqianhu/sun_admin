stages:
  - build
  - package
  - push

variables:
  GIT_DEPTH: "0"
  VERSION: "$CI_COMMIT_SHORT_SHA"
  HARBOR_PROJECT: sun_admin

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "product"'
    - when: never

before_script:
  - echo "checking docker daemon status..."
  - docker info || (echo "docker daemon is not running!" && exit 1)

build_back:
  stage: build
  script:
    - cd back
    - docker build --build-arg VERSION="$VERSION" -t sun_admin_back:$VERSION .
  tags:
    - runner22

build_front:
  stage: build
  script:
    - cd front
    - docker build -t sun_admin_front:$VERSION .
  tags:
    - runner22

build_front_mobile:
  stage: build
  script:
    - cd front_mobile
    - docker build -t sun_admin_front_mobile:$VERSION .
  tags:
    - runner22

package_images:
  stage: package
  script:
    - docker save -o sun_admin_back_$VERSION.tar.gz sun_admin_back:$VERSION
    - docker save -o sun_admin_front_$VERSION.tar.gz sun_admin_front:$VERSION
    - docker save -o sun_admin_front_mobile_$VERSION.tar.gz sun_admin_front_mobile:$VERSION
  artifacts:
    name: sun_admin_$VERSION
    paths:
      - sun_admin_back_$VERSION.tar.gz 
      - sun_admin_front_$VERSION.tar.gz
      - sun_admin_front_mobile_$VERSION.tar.gz
    expire_in: 1 week
  tags:
    - runner22

push_images:
  stage: push
  needs:
    - package_images
  before_script:
    - 'test -n "$HARBOR_REGISTRY" || (echo "HARBOR_REGISTRY is not configured" && exit 1)'
    - 'test -n "$HARBOR_USERNAME" || (echo "HARBOR_USERNAME is not configured" && exit 1)'
    - 'test -n "$HARBOR_PASSWORD" || (echo "HARBOR_PASSWORD is not configured" && exit 1)'
    - 'printf "%s" "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin'
  script:
    - docker tag sun_admin_back:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_back:$VERSION"
    - docker tag sun_admin_front:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front:$VERSION"
    - docker tag sun_admin_front_mobile:$VERSION "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front_mobile:$VERSION"
    
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_back:$VERSION"
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front:$VERSION"
    - docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/sun_admin_front_mobile:$VERSION"
  after_script:
    - docker logout "$HARBOR_REGISTRY" || true
  tags:
    - runner22
