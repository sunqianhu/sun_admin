version: '3.8'

services:
  #后端
  sun_admin_back:
    #build:
    #  context: ./back/
    #  dockerfile: Dockerfile
    image: sun_admin_back:latest
    container_name: sun_admin_back
    volumes:
      - /home/www/sun_admin.sunqianhu.cc/back/public/storage:/var/www/html/public/storage
    networks:
      - sun_admin
    restart: always
  #前端
  sun_admin_front:
    #build:
    #  context: ./front/
    #  dockerfile: Dockerfile
    image: sun_admin_front:latest #镜像名版本号
    container_name: sun_admin_front #容器名
    depends_on:
      - sun_admin_back #确保后端容器先启动
    ports:
      - "80:80"
    networks:
      - sun_admin
    restart: always
  #数据库
  sun_admin_mysql:
    image: mysql:5.7.44
    container_name: sun_admin_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Hello*@SunAdmin#
      MYSQL_DATABASE: sun_admin
      MYSQL_USER: sun_admin
      MYSQL_PASSWORD: aW9%mY1(fV9[gI6!
    volumes:
      - /home/www/sun_admin.sunqianhu.com/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - sun_admin
    restart: always
networks:
  sun_admin:
    driver: bridge
