[supervisord]
nodaemon=true

[program:nginx]
command=/usr/local/nginx-1.31.9/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx_stderr.log
stdout_logfile=/var/log/supervisor/nginx_stdout.log

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm_stderr.log
stdout_logfile=/var/log/supervisor/php-fpm_stdout.log

[program:message]
directory = /var/www/html
command = php think message
user = www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/message_stderr.log
stdout_logfile=/var/log/supervisor/message_stdout.log

[program:queue_message]
directory = /var/www/html
command = php think queue:work --queue=message --tries=3 --delay=30
user = www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/queue_message_stderr.log
stdout_logfile=/var/log/supervisor/queue_message_stdout.log
