
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    server {
        listen       80;
        server_name  localhost;
		client_max_body_size 200m;
        
        index index.html index.htm;
        root /usr/share/nginx/html;
		
		#首页不缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
		
		#websocket message
		location ^~ /websocket-message {
			proxy_pass http://back:7001/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $host;
		}
		
        #附件
        location ^~ /api/file {                                                                    
            if ($request_uri ~* .*\.(doc|docx|rar|zip|xls|xlsx|ppt|pptx|txt)\?file_name=(.+)$) {
                add_header Content-Disposition "attachment; filename=$arg_file_name";
            }                                               
            proxy_pass http://internet_back/file;
        }
		
        #后端请求
        location ^~ /api/ {
            proxy_pass http://back/;
			
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
			
			proxy_buffering off;
            proxy_cache off;
        }
		
        #转发
        location / {
            try_files $uri $uri/ @fallback;
        }
        location @fallback {
            rewrite ^ /index.html break;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
