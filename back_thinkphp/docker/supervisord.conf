[supervisord]
nodaemon=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor_nginx_stderr.log
stdout_logfile=/var/log/supervisor_nginx_stdout.log

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor_php-fpm_stderr.log
stdout_logfile=/var/log/supervisor_php-fpm_stdout.log

[program:message]
directory = /var/www/html
user = www-data
command = php think message
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor_message_stderr.log
stdout_logfile=/var/log/supervisor_message_stdout.log

[program:message_job]
directory = /var/www/html
user = www-data
command = php think queue:work --queue=message
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor_message_job_stderr.log
stdout_logfile=/var/log/supervisor_message_job_stdout.log